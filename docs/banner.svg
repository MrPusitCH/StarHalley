<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="StarHalley — ดาวหางฮัลเลย์">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040f"/>
      <stop offset="0.55" stop-color="#0a1238"/>
      <stop offset="1" stop-color="#2a1a55"/>
    </linearGradient>
    <radialGradient id="nebA" cx="0.2" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#7846c8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7846c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="0.82" cy="0.25" r="0.4">
      <stop offset="0" stop-color="#2878dc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2878dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coma" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#dcf5ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#78c8ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5090ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#c8ebff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#7aa8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9bd2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#a9d6ff"/>
      <stop offset="1" stop-color="#ff9bd2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="orbit" d="M -260 250 Q 600 -40 1460 210"/>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>
  <rect width="1200" height="360" fill="url(#nebA)"/>
  <rect width="1200" height="360" fill="url(#nebB)"/>

  <!-- twinkling stars -->
  <g fill="#eef4ff">
    <circle cx="60" cy="40" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="120" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="60" r="1.6"><animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="180" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="30" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="290" r="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="80" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="40" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="300" r="1.1"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="110" r="1.7"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="50" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="160" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="70" r="0.9"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="250" r="1.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="300" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="310" r="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="320" r="1"><animate attributeName="opacity" values="1;0.4;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="200" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- comet gliding along a soft arc -->
  <g>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" calcMode="spline" keyTimes="0;1" keySplines="0.35 0 0.65 1">
      <mpath href="#orbit"/>
    </animateMotion>
    <path d="M 0 0 L -260 -10 Q -280 0 -260 10 Z" fill="url(#tail)" opacity="0.85"/>
    <path d="M 0 0 L -170 -22 Q -185 -8 -170 4 Z" fill="url(#tail)" opacity="0.45"/>
    <circle r="26" fill="url(#coma)"/>
    <circle r="4" fill="#ffffff"/>
  </g>

  <!-- hills -->
  <path d="M0 360 L0 318 C 160 296 300 330 470 312 C 640 294 780 326 950 306 C 1060 294 1140 304 1200 300 L1200 360 Z" fill="#0d0b26"/>
  <path d="M0 360 L0 340 C 200 328 380 352 600 338 C 820 326 1000 350 1200 334 L1200 360 Z" fill="#05040f"/>

  <!-- title -->
  <g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="150" font-size="84" font-weight="700" fill="url(#title)" filter="url(#glow)" letter-spacing="2">StarHalley</text>
    <text x="600" y="198" font-size="26" fill="#dbe6ff" fill-opacity="0.85" font-family="'Leelawadee UI', 'Noto Sans Thai', Tahoma, sans-serif">ดาวหางฮัลเลย์ · a night sky that dances to the music</text>
  </g>
</svg>
